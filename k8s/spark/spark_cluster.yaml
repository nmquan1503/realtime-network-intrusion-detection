apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
      - name: spark-master
        image: mquan1503/bigdata-spark:latest  # <--- Switched to Official Image
        imagePullPolicy: IfNotPresent
        command: [
          "/opt/spark/bin/spark-class", 
          "org.apache.spark.deploy.master.Master"
        ]
        env:
        - name: SPARK_MASTER_OPTS
          value: "-Dspark.master.rest.enabled=true -Dspark.master.rest.port=6066"
        ports:
        - containerPort: 7077
        - containerPort: 6066
        - containerPort: 8080
        volumeMounts:
        - name: ivy-cache
          mountPath: /tmp
      volumes:
      - name: ivy-cache
        emptyDir: {}
---
# 3. Spark Worker Deployment (UPDATED for Apache Image)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      containers:
      - name: spark-worker
        image: mquan1503/bigdata-spark:latest # <--- Switched to Official Image
        imagePullPolicy: IfNotPresent
        command: [
          "/opt/spark/bin/spark-class", 
          "org.apache.spark.deploy.worker.Worker",
          "spark://spark-master-svc:7077"
        ]
        volumeMounts:
        - name: spark-work-dir 
          mountPath: /opt/spark/work
        - name: ivy-cache
          mountPath: /tmp
      volumes:
      - name: spark-work-dir 
        emptyDir: {}
      - name: ivy-cache
        emptyDir: {}
      
