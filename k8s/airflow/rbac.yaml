apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-sa
  namespace: bigdata
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-role
  namespace: bigdata
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status", "events"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-rolebinding
  namespace: bigdata
subjects:
  - kind: ServiceAccount
    name: airflow-sa
    namespace: bigdata
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-role
