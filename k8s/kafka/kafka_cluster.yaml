apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: bigdata
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  replicas: 1
  roles:
    - controller
    - broker
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "1536Mi"
  jvmOptions:
    -Xms: 512m
    -Xmx: 1024m
  storage:
    type: ephemeral
    # type: jbod
    # volumes:
    #   - id: 0
    #     type: persistent-claim
    #     size: 1Gi
    #     deleteClaim: false
    #     kraftMetadata: shared
---

apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka-cluster 
  namespace: bigdata
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.1.1
    metadataVersion: 4.1-IV1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
      - name: external
        port: 9094
        type: nodeport
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      message.max.bytes: 10485760
      replica.fetch.max.bytes: 10485760
      socket.request.max.bytes: 10485760
  entityOperator:
    topicOperator: {}
    userOperator: {}
