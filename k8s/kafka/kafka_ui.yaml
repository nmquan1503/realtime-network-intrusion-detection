apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "kafka-cluster"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka-cluster-kafka-bootstrap:9092"
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL
              value: "PLAINTEXT"
---
# apiVersion: v1
# kind: Service
# metadata:
#   name: kafka-ui
#   namespace: kafka
# spec:
#   type: ClusterIP
#   selector:
#     app: kafka-ui
#   ports:
#     - port: 8080
#       targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui-external
  namespace: bigdata
spec:
  type: LoadBalancer
  selector:
    app: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080