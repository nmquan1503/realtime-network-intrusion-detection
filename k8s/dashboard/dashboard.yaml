apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: bigdata
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: mquan1503/bigdata-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: config
          env:
            - name: PREDICTION_KAFKA_TOPIC
              value: prediction-topic
            - name: DASHBOARD_KAFKA_GROUP_ID
              value: dashboard
            - name: DASHBOARD_MAX_ITEMS
              value: "200"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: bigdata
spec:
  type: LoadBalancer
  selector:
    app: dashboard
  ports:
    - name: http
      port: 5000
      targetPort: 5000
