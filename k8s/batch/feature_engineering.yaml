apiVersion: batch/v1
kind: Job
metadata:
  name: batch-feature-engineering
  namespace: bigdata
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: batch-feature-engineering
    spec:
      restartPolicy: OnFailure
      containers:
        - name: batch-feature-engineering
          image: mquan1503/bigdata-batch:latest
          imagePullPolicy: Always
          command: ["python3", "-u", "/app/feature_engineering.py"]
          envFrom:
            - configMapRef:
                name: config
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: "0.1"
              memory: "3Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: tmp-storage
              mountPath: /tmp
      volumes:
        - name: tmp-storage
          emptyDir: {}
