apiVersion: batch/v1
kind: Job
metadata:
  name: batch-feature-engineering
  namespace: bigdata
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: batch-feature-engineering
    spec:
      restartPolicy: OnFailure
      containers:
        - name: batch-feature-engineering
          image: mquan1503/bigdata-batch:latest
          imagePullPolicy: Always
          command: ["python3", "-u", "/app/feature_engineering.py"]
          envFrom:
            - configMapRef:
                name: config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: tmp-storage
              mountPath: /tmp
      volumes:
        - name: tmp-storage
          emptyDir: {}