<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realtime Intrusion Detection</title>
  <style>
    :root {
      --ink: #172017;
      --muted: #657166;
      --paper: #f3efe3;
      --card: rgba(255, 252, 241, 0.9);
      --line: rgba(23, 32, 23, 0.12);
      --good: #1c8a54;
      --bad: #c94932;
      --gold: #d9971e;
      --blue: #315f8a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Aptos Display", "Trebuchet MS", sans-serif;
      background:
        radial-gradient(circle at 12% 14%, rgba(217, 151, 30, 0.22), transparent 28rem),
        radial-gradient(circle at 88% 6%, rgba(49, 95, 138, 0.20), transparent 24rem),
        linear-gradient(135deg, #f5f0df 0%, #e6eadf 58%, #dce6df 100%);
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 22px;
      align-items: stretch;
      margin-bottom: 22px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 20px 60px rgba(30, 39, 31, 0.12);
      backdrop-filter: blur(12px);
    }

    .title-card {
      padding: 30px;
      position: relative;
      overflow: hidden;
    }

    .title-card::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -70px;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      border: 34px solid rgba(28, 138, 84, 0.12);
    }

    h1 {
      margin: 0;
      max-width: 740px;
      font-size: clamp(2.2rem, 5vw, 5.2rem);
      line-height: 0.92;
      letter-spacing: -0.07em;
    }

    .subtitle {
      margin: 18px 0 0;
      max-width: 650px;
      color: var(--muted);
      font-size: 1.02rem;
    }

    .model-card {
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .model-version {
      word-break: break-word;
      font-size: 1.05rem;
      font-weight: 800;
    }

    .pulse {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--good);
      font-weight: 800;
    }

    .pulse::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--good);
      box-shadow: 0 0 0 0 rgba(28, 138, 84, 0.5);
      animation: breathe 1.6s infinite;
    }

    @keyframes breathe {
      70% { box-shadow: 0 0 0 12px rgba(28, 138, 84, 0); }
      100% { box-shadow: 0 0 0 0 rgba(28, 138, 84, 0); }
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat {
      padding: 18px;
      min-height: 120px;
    }

    .stat-value {
      margin-top: 14px;
      font-size: clamp(1.7rem, 3vw, 2.8rem);
      font-weight: 900;
      letter-spacing: -0.05em;
    }

    .content {
      display: grid;
      grid-template-columns: 0.82fr 1.18fr;
      gap: 22px;
    }

    .chart, .table-wrap {
      padding: 22px;
    }

    .bars {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 120px 1fr 44px;
      gap: 10px;
      align-items: center;
      font-size: 0.92rem;
    }

    .track {
      height: 13px;
      border-radius: 999px;
      background: rgba(23, 32, 23, 0.08);
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--gold));
      transition: width 0.35s ease;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pill {
      display: inline-flex;
      padding: 5px 9px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.78rem;
      background: rgba(49, 95, 138, 0.12);
      color: var(--blue);
    }

    .pill.attack {
      background: rgba(201, 73, 50, 0.13);
      color: var(--bad);
    }

    .pill.invalid {
      background: rgba(101, 113, 102, 0.14);
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .hero, .content {
        grid-template-columns: 1fr;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 560px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .bar-row {
        grid-template-columns: 84px 1fr 34px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="panel title-card">
        <h1>REALTIME NETWORK INTRUSION DETECTION</h1>
        <p class="subtitle">Prediction based on latest model.</p>
      </div>
      <div class="panel model-card">
        <div>
          <div class="eyebrow">Model Version</div>
          <div class="model-version" id="modelVersion">waiting for predictions...</div>
        </div>
        <div class="pulse">Live refresh</div>
      </div>
    </section>

    <section class="cards">
      <div class="panel stat"><div class="eyebrow">Total</div><div class="stat-value" id="total">0</div></div>
      <div class="panel stat"><div class="eyebrow">Benign</div><div class="stat-value" id="benign">0</div></div>
      <div class="panel stat"><div class="eyebrow">Attack</div><div class="stat-value" id="attack">0</div></div>
      <div class="panel stat"><div class="eyebrow">Invalid</div><div class="stat-value" id="invalid">0</div></div>
      <div class="panel stat"><div class="eyebrow">Predict / Sec</div><div class="stat-value"><span id="throughput">0</span><small> r/s</small></div></div>
      <div class="panel stat"><div class="eyebrow">Avg Latency</div><div class="stat-value"><span id="latency">0</span><small> ms</small></div></div>
    </section>

    <section class="content">
      <div class="panel chart">
        <div class="eyebrow">Label Distribution</div>
        <div class="bars" id="bars"></div>
      </div>
      <div class="panel table-wrap">
        <div class="eyebrow">Recent Predictions</div>
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Prediction</th>
              <th>Confidence</th>
              <th>Actual</th>
              <th>Latency</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const fmt = (value) => value === null || value === undefined ? "--" : value;

    function renderBars(labelCounts) {
      const bars = document.getElementById("bars");
      const entries = Object.entries(labelCounts || {}).sort((a, b) => b[1] - a[1]);
      const max = Math.max(1, ...entries.map(([, count]) => count));
      bars.innerHTML = entries.length ? "" : "<p>No prediction labels yet.</p>";

      for (const [label, count] of entries) {
        const row = document.createElement("div");
        row.className = "bar-row";
        row.innerHTML = `
          <strong>${label}</strong>
          <div class="track"><div class="bar" style="width:${(count / max) * 100}%"></div></div>
          <span>${count}</span>
        `;
        bars.appendChild(row);
      }
    }

    function renderRows(items) {
      const body = document.getElementById("rows");
      body.innerHTML = "";
      for (const item of (items || []).slice(0, 30)) {
        const label = item.status === "ok" ? item.predicted_label : item.error;
        const pillClass = item.status === "invalid" ? "invalid" : (item.predicted_label === "Benign" ? "" : "attack");
        const confidence = item.confidence === null || item.confidence === undefined
          ? "--"
          : `${(item.confidence * 100).toFixed(1)}%`;
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${fmt(item.event_time)}</td>
          <td><span class="pill ${pillClass}">${fmt(label)}</span></td>
          <td>${confidence}</td>
          <td>${fmt(item.actual_label)}</td>
          <td>${fmt(item.latency_ms)} ms</td>
        `;
        body.appendChild(row);
      }
    }

    async function refresh() {
      const response = await fetch("/data");
      const data = await response.json();
      document.getElementById("modelVersion").textContent = data.model_version || "waiting for predictions...";
      document.getElementById("total").textContent = data.total;
      document.getElementById("benign").textContent = data.benign_count;
      document.getElementById("attack").textContent = data.attack_count;
      document.getElementById("invalid").textContent = data.invalid_count;
      document.getElementById("throughput").textContent = data.predictions_per_sec || 0;
      document.getElementById("latency").textContent = data.avg_latency_ms;
      renderBars(data.label_counts);
      renderRows(data.items);
    }

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
